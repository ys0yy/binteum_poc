<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>빈틈 - 혼잡도 제보 테스트</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; background: #f8f9fa; }
    .card { border: 1px solid #ddd; padding: 20px; border-radius: 10px; background: white; }
    .status { font-weight: bold; font-size: 18px; color: #2b6cb0; }
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
    .btn-여유 { background: #48bb78; }
    .btn-보통 { background: #ed8936; }
    .btn-혼잡 { background: #e53e3e; }
    .info { font-size: 13px; color: #666; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
  </style>
</head>
<body>

  <h2>☕ 카페 혼잡도 제보 (PoC)</h2>

  <div class="card">
    <h3>📍 1호점: 투썸플레이스 대학로점</h3>
    
    <p>현재 혼잡도: <span id="혼잡도표시" class="status">정보 부족</span></p>
    <p>신뢰도: <strong id="신뢰도표시">측정 불가</strong></p>

    <hr>

    <p><strong>실시간 제보하기</strong></p>
    <div>
      닉네임: <input type="text" id="닉네임" placeholder="익명">
    </div>

    <div class="btn-group">
      <button class="btn-여유" onclick="제보하기('여유')">🟢 여유</button>
      <button class="btn-보통" onclick="제보하기('보통')">🟡 보통</button>
      <button class="btn-혼잡" onclick="제보하기('혼잡')">🔴 혼잡</button>
    </div>

    <div class="info" id="상태설명">
      제보가 3건 이상 누적되어야 현재 혼잡도가 계산됩니다.
    </div>
  </div>

  <script>
    // 제보 데이터를 담아둘 리스트
    let 제보목록 = [];

    // [기능 1] 버튼을 누르면 제보 저장하기
    function 제보하기(선택한상태) {
      let 입력닉네임 = document.getElementById('닉네임').value;
      if (입력닉네임 === '') {
        입력닉네임 = '익명';
      }

      // 제보 정보 추가
      제보목록.push({
        이름: 입력닉네임,
        상태: 선택한상태,
        시간: new Date() // 현재 시간 저장
      });

      alert(입력닉네임 + '님의 [' + 선택한상태 + '] 제보가 완료되었습니다!');
      document.getElementById('닉네임').value = ''; // 입력창 비우기

      // 혼잡도 다시 계산하기
      혼잡도계산하기();
    }

    // [기능 2] 제보 데이터를 바탕으로 혼잡도 계산하기
    function 혼잡도계산하기() {
      let 현재시간 = new Date();
      let 최근제보목록 = [];

      // 1. 최근 60분 이내 제보만 골라내기 (쉬운 for문 사용)
      for (let i = 0; i < 제보목록.length; i++) {
        let 지나간시간분 = (현재시간 - 제보목록[i].시간) / 1000 / 60;
        if (지나간시간분 <= 60) {
          최근제보목록.push(제보목록[i]);
        }
      }

      let 혼잡도글자 = document.getElementById('혼잡도표시');
      let 신뢰도글자 = document.getElementById('신뢰도표시');
      let 설명글자 = document.getElementById('상태설명');

      // 2. 제보가 3건 미만이면 '정보 부족' 처리
      if (최근제보목록.length < 3) {
        혼잡도글자.innerText = "정보 부족";
        신뢰도글자.innerText = "측정 불가 (최소 3건 필요)";
        설명글자.innerHTML = "현재 제보 건수: <b>" + 최근제보목록.length + "건</b> (3건 이상 필요)";
        return;
      }

      // 3. 각 상태별 개수 세기
      let 여유개수 = 0;
      let 보통개수 = 0;
      let 혼잡개수 = 0;

      for (let i = 0; i < 최근제보목록.length; i++) {
        if (최근제보목록[i].상태 === '여유') 여유개수++;
        if (최근제보목록[i].상태 === '보통') 보통개수++;
        if (최근제보목록[i].상태 === '혼잡') 혼잡개수++;
      }

      // 4. 가장 많은 제보 상태 구하기
      let 최종상태 = '보통';

      if (여유개수 > 보통개수 && 여유개수 > 혼잡개수) {
        최종상태 = '여유';
        신뢰도글자.innerText = 최근제보목록.length >= 5 ? "높음" : "보통";
      } else if (보통개수 > 여유개수 && 보통개수 > 혼잡개수) {
        최종상태 = '보통';
        신뢰도글자.innerText = 최근제보목록.length >= 5 ? "높음" : "보통";
      } else if (혼잡개수 > 여유개수 && 혼잡개수 > 보통개수) {
        최종상태 = '혼잡';
        신뢰도글자.innerText = 최근제보목록.length >= 5 ? "높음" : "보통";
      } else {
        // 동점일 경우: 가장 최근에 등록된 제보 상태로 결정
        let 가장최신제보 = 최근제보목록[최근제보목록.length - 1];
        최종상태 = 가장최신제보.상태;
        신뢰도글자.innerText = "참고 정보 (의견 엇갈림)";
      }

      // 화면에 결과 보여주기
      혼잡도글자.innerText = 최종상태;
      설명글자.innerHTML = "<b>최근 60분 제보: " + 최근제보목록.length + "건</b><br>" +
        "(여유: " + 여유개수 + " | 보통: " + 보통개수 + " | 혼잡: " + 혼잡개수 + ")";
    }
  </script>
</body>
</html>
